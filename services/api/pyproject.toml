[project]
name = "poc-studio-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "cssselect>=1.6.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "lxml>=6.1.3",
    "openai>=3.57.0",
    "playwright>=1.65.2",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.1.9",
    "sse-starlette>=3.7.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not slow and not live'"
markers = [
    "slow: npm network or a real build",
    "browser: needs Playwright Chromium",
    "live: real gateway or GitHub, opt-in via EVAL_LIVE=1 or GITHUB_MODE=live",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pyright]
include = ["poc_studio"]
pythonVersion = "3.12"
