name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LLM_PROVIDER: mock
  GITHUB_MODE: mock
  APP_ENV: test

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - run: npm ci

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync

      - name: Install Playwright Chromium
        working-directory: services/api
        run: uv run playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
